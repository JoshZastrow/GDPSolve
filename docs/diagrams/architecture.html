<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDPSolve document pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; min-width: 0; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }

    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · GDPSolve</p>
    <h1>GDPSolve document pipeline</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">GDPSolve document pipeline</title>
      <desc id="architecture-desc">A caller sends an extraction request to process(), which asks the router for jobs, puts them on a SQLite queue, and waits; workers claim jobs, sample Inkling on Tinker, call tools that store page images and OCR in a content-addressed object store, and report results back through the queue.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zones (before arrows and nodes) -->
      <rect x="300" y="104" width="232" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="376" y="108" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MAIN PROCESS</text>

      <rect x="620" y="264" width="232" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="700" y="268" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="736" y="277" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL STATE</text>

      <rect x="940" y="264" width="232" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="948" y="268" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="980" y="277" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">WORKER ×N</text>

      <!-- Arrows (behind nodes) -->
      <!-- Caller -> process(): request; return: result -->
      <line x1="232" y1="316" x2="320" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="340" x2="232" y2="340" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- process() -> Router -->
      <line x1="416" y1="296" x2="416" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- process() -> queue: put jobs; queue -> process(): reports (wait) -->
      <line x1="512" y1="316" x2="640" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="640" y1="340" x2="512" y2="340" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- queue -> Worker: claim; Worker -> queue: report -->
      <line x1="832" y1="316" x2="960" y2="316" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="960" y1="340" x2="832" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Worker -> Inkling (Tinker API) -->
      <line x1="1056" y1="296" x2="1056" y2="200" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- Worker -> Tools -->
      <line x1="1056" y1="360" x2="1056" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Tools -> Object store -->
      <line x1="960" y1="488" x2="832" y2="488" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- process() (ingest) -> Object store: one bend -->
      <path d="M 416,360 V 480 Q 416,488 424,488 H 640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (opaque masks, 6px from their strokes) -->
      <rect x="252" y="298" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="276" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REQUEST</text>
      <rect x="254" y="346" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="276" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>

      <rect x="424" y="242" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="464" y="251" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN / MERGE</text>

      <rect x="548" y="298" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUT JOBS</text>
      <rect x="550" y="346" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="576" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORTS</text>

      <rect x="866" y="298" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="896" y="307" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLAIM JOB</text>
      <rect x="874" y="346" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="896" y="355" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT</text>

      <rect x="1064" y="242" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1086" y="251" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SAMPLE</text>

      <rect x="1064" y="402" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1096" y="411" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL CALL</text>

      <rect x="864" y="470" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="896" y="479" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUT BLOBS</text>

      <rect x="506" y="470" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="532" y="479" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PUT PDF</text>

      <!-- Node: Caller (input) -->
      <rect x="64" y="296" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="296" width="168" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <rect x="72" y="304" width="20" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
      <text x="82" y="313" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IN</text>
      <text x="148" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Caller</text>
      <text x="148" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">eval gdp-pdf · extract · SDK</text>

      <!-- Node: Router (backend) -->
      <rect x="320" y="136" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="136" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="144" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="344" y="153" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLAN</text>
      <text x="416" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
      <text x="416" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan() · merge() · policy π_R</text>

      <!-- Node: process() (focal) -->
      <rect x="320" y="296" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="320" y="296" width="192" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="328" y="304" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="344" y="313" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEAM</text>
      <text x="416" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">process()</text>
      <text x="416" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingest → plan → wait → merge</text>

      <!-- Node: Job queue (store) -->
      <rect x="640" y="296" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="296" width="192" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="648" y="304" width="20" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="658" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="736" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Job queue</text>
      <text x="736" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SQLite · jobs · reports · threads</text>

      <!-- Node: Object store (store) -->
      <rect x="640" y="456" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="456" width="192" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="648" y="464" width="20" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="658" y="473" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FS</text>
      <text x="736" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Object store</text>
      <text x="736" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">var/objects · sha256</text>

      <!-- Node: Inkling (external) -->
      <rect x="960" y="136" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="136" width="192" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="968" y="144" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="982" y="153" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="1056" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inkling</text>
      <text x="1056" y="188" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Tinker sampling</text>

      <!-- Node: Worker (focal) -->
      <rect x="960" y="296" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="296" width="192" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <rect x="968" y="304" width="40" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
      <text x="988" y="313" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="1056" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Worker</text>
      <text x="1056" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">run_job() · policy π_W</text>

      <!-- Node: Tools (backend) -->
      <rect x="960" y="456" width="192" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="960" y="456" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="968" y="464" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="988" y="473" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
      <text x="1056" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tools</text>
      <text x="1056" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10-tool toolbox · memoized</text>

      <!-- Legend strip -->
      <line x1="64" y1="600" x2="1216" y2="600" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="64" y="620" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="64" y="636" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
      <text x="84" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Focal</text>

      <rect x="148" y="636" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="168" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Code</text>

      <rect x="228" y="636" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="248" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Store</text>

      <rect x="308" y="636" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
      <text x="328" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Input</text>

      <rect x="388" y="636" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="408" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">External</text>

      <line x1="488" y1="641" x2="516" y2="641" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="524" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Call / write</text>

      <line x1="616" y1="641" x2="644" y2="641" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="652" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Return / read</text>

      <line x1="756" y1="641" x2="784" y2="641" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="792" y="644" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Remote API</text>
    </svg>
    </div>
  </div>
</body>
</html>
