[project]
name = "gdpsolve"
version = "0.1.0"
description = "Router + persistent queue + tool-using worker system for complex document extraction, co-trained with RL against GDP.pdf"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.31",
    "pydantic>=2.14.2",
    "pypdfium2>=4.30",
    "typer>=0.15",
]

[project.scripts]
gdpsolve = "gdpsolve.cli:app"

[project.optional-dependencies]
train = [
    "tinker>=0.36.0",
    "tinker-cookbook>=0.5.9",
]
eval = [
    "gdp-pdf @ git+https://github.com/surge-ai/gdp-pdf@7a72a514a6ab19c90babb00adc817e4ae86b9c1b",
]
parsebench = [
    "parse-bench @ git+https://github.com/run-llama/ParseBench@c38085d2ccd7f717900037e361806d22c51bc33b",  # leaderboard scored_with
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
