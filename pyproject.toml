[project]
name = "gdpsolve"
version = "0.1.0"
description = "Router + persistent queue + tool-using worker system for complex document extraction, co-trained with RL against GDP.pdf"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.31",
    "pydantic>=2.14.2",
    "typer>=0.15",
]

[project.scripts]
gdpsolve = "gdpsolve.cli:app"

[project.optional-dependencies]
train = [
    "tinker>=0.36.0",
    "tinker-cookbook>=0.5.9",
    "verifiers>=0.4.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
