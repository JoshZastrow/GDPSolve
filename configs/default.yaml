# Runtime defaults (see docs/TRD.md). Values are placeholders until benchmarked.
queue:
  db_path: var/gdpsolve.db
  lease_s: 120
  max_attempts: 3
router:
  model: null            # small policy model; heuristic planner until trained
workers:
  concurrency: 8
  model: thinkingmachines/Inkling-Small   # served via Tinker
  max_tool_calls: 40
ocr:
  model: PaddlePaddle/PaddleOCR-VL-1.6
  dpi: 200
sla:
  deadline_s: 300
eval:
  dataset_dir: data/gdp_pdf
  judge_model: google/gemini-3.5-flash   # matches the public leaderboard config
